version: "3.7"
services:
  # yolo
  yolo:
    image: yolo-v1:latest
    container_name: yolo-v1
    ports:
      - "4000:4000" # default port for yolo
    volumes:
      - ./yolo/config:/yolo/config:rw
      - ./yolo/data:/yolo/data:rw
      - ./yolo/log:/yolo/log:rw
    restart: unless-stopped

# volumes for mapping data,config and log
volumes:
  config:
  data:
  log:

networks:
  default:
    name: mqtt5-network

